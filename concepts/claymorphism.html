<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claymorphism — Bangla alphabet for kids · Shaifur Rahaman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDE6FF;
  --lilac:#C9B8FF;
  --peach:#FFC7AE;
  --mint:#B6EBD3;
  --butter:#FFE08A;
  --coral:#FF8C7A;
  --ink:#35285A;
  --ink-soft:#5E5286;
  --r-xl:44px; --r-lg:32px; --r-md:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:"Baloo Da 2",system-ui,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(600px 400px at 8% 10%, #F7E9FF 0, transparent 70%),
    radial-gradient(700px 500px at 95% 90%, #E0F4FF 0, transparent 70%),
    var(--bg);
}
/* the clay recipe: soft outer drop, light inset top-left, shade inset bottom-right */
.clay{
  border-radius:var(--r-xl);
  box-shadow:
    18px 22px 40px rgba(76,52,140,.20),
    inset -10px -12px 22px rgba(60,30,120,.14),
    inset 10px 12px 22px rgba(255,255,255,.75);
}
.clay-sm{
  border-radius:var(--r-md);
  box-shadow:
    8px 10px 18px rgba(76,52,140,.18),
    inset -6px -7px 12px rgba(60,30,120,.13),
    inset 6px 7px 12px rgba(255,255,255,.8);
}
a,button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:4px;border-radius:20px}

.app{max-width:1360px;margin:0 auto;padding:24px 40px 44px;display:grid;gap:28px;
  grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:-.01em}
.logo-mark{width:58px;height:58px;display:grid;place-items:center;background:var(--coral);color:#fff;font-size:30px;border-radius:20px;
  box-shadow:6px 8px 16px rgba(200,80,70,.35),inset -5px -6px 10px rgba(150,30,30,.25),inset 5px 6px 10px rgba(255,255,255,.55)}
.top-spacer{flex:1}
.stars-pill{display:flex;align-items:center;gap:10px;background:var(--butter);padding:10px 22px 10px 14px;font-weight:700;font-size:20px;border-radius:999px}
.kid{display:flex;align-items:center;gap:12px;background:#fff;padding:8px 22px 8px 8px;border-radius:999px;font-weight:700;font-size:19px}
.kid-face{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center}

/* lesson card */
.lesson{background:#FFF6EF;padding:36px 40px 36px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:22px 40px;align-items:start}
.lesson-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.lesson-head h1{font-size:26px;font-weight:700;color:var(--ink-soft)}
.lesson-head h1 b{color:var(--ink);font-weight:800}
.step-dots{display:flex;gap:8px}
.step-dots i{width:14px;height:14px;border-radius:50%;background:#E8DCF5;box-shadow:inset 2px 2px 4px rgba(60,30,120,.18)}
.step-dots i.on{background:var(--coral);box-shadow:inset -2px -2px 4px rgba(150,30,30,.3),inset 2px 2px 4px rgba(255,255,255,.6)}
.letter{width:300px;height:300px;background:var(--lilac);display:grid;place-items:center;border-radius:64px;
  font-size:205px;font-weight:800;line-height:1;color:#fff;
  text-shadow:0 6px 0 rgba(90,60,170,.35), 0 14px 24px rgba(70,40,150,.25);
  box-shadow:22px 26px 44px rgba(76,52,140,.28),inset -16px -18px 30px rgba(70,40,150,.30),inset 14px 16px 26px rgba(255,255,255,.7)}
.letter span{transform:translateY(18px)}
.word{align-self:center}
.word .bn{font-size:88px;font-weight:800;line-height:1;letter-spacing:-.01em}
.word .say{font-size:22px;color:var(--ink-soft);margin-top:12px;font-weight:600}
.word .en{font-size:22px;margin-top:2px;font-weight:600;color:var(--ink-soft)}
.snake{margin-top:22px;width:300px;height:auto;filter:drop-shadow(8px 12px 12px rgba(40,120,80,.25))}
.actions{grid-column:1/-1;display:flex;gap:18px;align-items:center}
.btn{border:0;cursor:pointer;padding:18px 32px;font-weight:800;font-size:22px;border-radius:999px;display:inline-flex;align-items:center;gap:12px;white-space:nowrap;transition:transform .15s ease, box-shadow .15s ease}
.btn-listen{background:var(--mint);box-shadow:8px 10px 20px rgba(40,120,90,.25),inset -6px -8px 14px rgba(20,90,60,.18),inset 6px 8px 14px rgba(255,255,255,.75)}
.btn-next{background:var(--coral);color:#fff;box-shadow:8px 10px 20px rgba(200,80,70,.32),inset -6px -8px 14px rgba(150,30,30,.25),inset 6px 8px 14px rgba(255,255,255,.5)}
.btn-trace{background:#fff;box-shadow:8px 10px 20px rgba(76,52,140,.16),inset -6px -8px 14px rgba(60,30,120,.10),inset 6px 8px 14px rgba(255,255,255,.9)}
.btn:active,.btn.pressed{transform:translateY(3px) scale(.98);box-shadow:3px 4px 8px rgba(76,52,140,.18),inset -4px -5px 10px rgba(60,30,120,.15),inset 6px 8px 14px rgba(0,0,0,.08)}
.hint{margin-left:auto;font-size:18px;color:var(--ink-soft);font-weight:600;max-width:210px;line-height:1.25;text-align:right}

/* right column */
.side{display:grid;gap:28px;grid-template-rows:auto 1fr;min-width:0}
.progress{background:var(--butter);padding:28px 32px}
.progress h2{font-size:24px;font-weight:800;line-height:1.1}
.progress p{font-size:18px;color:#6A5530;font-weight:600;margin-top:4px}
.star-row{display:flex;gap:10px;margin-top:18px}
.star-row svg{width:48px;height:48px;filter:drop-shadow(3px 5px 5px rgba(160,100,0,.28))}
.bar{margin-top:18px;height:22px;border-radius:999px;background:#F6CE62;box-shadow:inset 4px 5px 8px rgba(140,90,0,.28),inset -3px -3px 6px rgba(255,255,255,.5);overflow:hidden}
.bar i{display:block;height:100%;width:64%;border-radius:999px;background:var(--coral);box-shadow:inset -3px -4px 6px rgba(150,30,30,.25),inset 3px 4px 6px rgba(255,255,255,.55)}

.tiles{background:#fff;padding:26px 28px 28px;display:flex;flex-direction:column}
.unlock{margin-top:auto;padding-top:18px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:var(--ink-soft)}
.unlock b{color:var(--ink)}
.lock{width:40px;height:40px;flex:none;border-radius:14px;background:var(--peach);display:grid;place-items:center}
.tiles h2{font-size:22px;font-weight:800;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:46px;font-weight:800;line-height:1;position:relative;border:0;cursor:pointer}
.tile span{transform:translateY(5px)}
.tile.done{background:var(--mint)}
.tile.now{background:var(--lilac);color:#fff;outline:4px solid #fff;outline-offset:-10px}
.tile.locked{border-radius:var(--r-md);background:#F1ECFA;color:#B7AED0;box-shadow:inset 6px 7px 12px rgba(60,30,120,.12),inset -6px -7px 12px rgba(255,255,255,.9)}
.tile.done::after{content:"";position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--butter);box-shadow:inset -2px -2px 3px rgba(160,100,0,.3),inset 2px 2px 3px rgba(255,255,255,.7)}

.back{position:fixed;left:40px;bottom:10px;font-size:15px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:4px 10px;border-radius:999px}
.back:hover{text-decoration:underline}

@media (max-width:1100px){
  .app{grid-template-columns:1fr;padding:20px 16px 64px;gap:20px}
  .lesson{grid-template-columns:1fr;padding:26px 22px;justify-items:center;text-align:center}
  .lesson-head{flex-direction:column;gap:10px}
  .letter{width:220px;height:220px;font-size:180px;border-radius:48px}
  .letter span{transform:translateY(16px)}
  .word .bn{font-size:64px}
  .snake{width:200px}
  .actions{flex-wrap:wrap;justify-content:center}
  .hint{margin:0;text-align:center;max-width:none}
  .back{position:static;display:block;text-align:center;margin:0 auto 20px}
}
@media (max-width:480px){
  .top{flex-wrap:wrap;gap:12px}
  .logo{font-size:24px}
  .top-spacer{display:none}
  .kid{order:3}
  .btn{padding:14px 22px;font-size:19px}
  .grid{gap:12px}
  .tile{font-size:36px}
  .star-row svg{width:40px;height:40px}
  .clay{border-radius:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A0"/><stop offset="1" stop-color="#FFB93B"/></linearGradient>
    <symbol id="star" viewBox="0 0 48 48"><path d="M24 4c1.6 0 2.6 1 3.3 2.5l4.2 8.6 9.3 1.4c3 .4 4 3.7 1.9 5.8l-6.8 6.6 1.6 9.4c.5 3-2.5 5-5.1 3.6L24 37.4l-8.4 4.5c-2.6 1.4-5.6-.6-5.1-3.6l1.6-9.4-6.8-6.6c-2.1-2.1-1.1-5.4 1.9-5.8l9.3-1.4 4.2-8.6C21.4 5 22.4 4 24 4z"/></symbol>
  </defs>
</svg>
<main class="app">
  <header class="top">
    <div class="logo"><span class="logo-mark clay-sm" aria-hidden="true">ক</span>Borno</div>
    <div class="top-spacer"></div>
    <div class="stars-pill clay-sm"><svg width="30" height="30" aria-hidden="true"><use href="#star" fill="url(#sg)"/></svg>42 stars</div>
    <div class="kid clay-sm"><span class="kid-face" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="18" r="12" fill="#FFE2D2"/><path d="M5 16c0-8 6-12 12-12s12 4 12 12c-3-4-7-5-12-5S8 12 5 16z" fill="#35285A"/><circle cx="13" cy="19" r="1.6" fill="#35285A"/><circle cx="21" cy="19" r="1.6" fill="#35285A"/><path d="M13.5 23.5c2 1.6 5 1.6 7 0" stroke="#35285A" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="10" cy="22" r="1.8" fill="#FF9E8C" opacity=".7"/><circle cx="24" cy="22" r="1.8" fill="#FF9E8C" opacity=".7"/></svg>
    </span>Nabila, age 5</div>
  </header>

  <section class="lesson clay" aria-labelledby="lesson-title">
    <div class="lesson-head">
      <h1 id="lesson-title">Warm-up round: <b>say অ again</b></h1>
      <div class="step-dots" aria-label="Step 2 of 4"><i class="on"></i><i class="on"></i><i></i><i></i></div>
    </div>
    <div class="letter" aria-label="Bangla letter অ, pronounced o"><span>অ</span></div>
    <div class="word">
      <div class="bn" lang="bn">অজগর</div>
      <p class="say">Say it: o-jo-gor</p>
      <p class="en">A big, sleepy python</p>
      <svg class="snake" viewBox="0 0 250 110" aria-hidden="true">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE3B8"/><stop offset="1" stop-color="#4DBB84"/></linearGradient>
        </defs>
        <path d="M18 84c18 0 22-40 50-40s28 40 56 40 28-44 56-44 28 22 40 22" fill="none" stroke="url(#body)" stroke-width="26" stroke-linecap="round"/>
        <path d="M22 78c16-2 22-34 46-34" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>
        <path d="M108 70c6 6 10 9 16 9" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
        <circle cx="96" cy="62" r="5" fill="#FFE08A"/><circle cx="150" cy="58" r="5" fill="#FFE08A"/><circle cx="60" cy="52" r="4" fill="#FFE08A"/>
        <ellipse cx="226" cy="58" rx="22" ry="18" fill="#6FD09C"/>
        <ellipse cx="220" cy="52" rx="10" ry="6" fill="#fff" opacity=".45"/>
        <circle cx="232" cy="54" r="4" fill="#35285A"/><circle cx="233.5" cy="52.5" r="1.3" fill="#fff"/>
        <path d="M244 64c4 1 6 3 6 6M244 64c3 3 3 6 1 8" stroke="#FF8C7A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="222" cy="64" r="3" fill="#FF9E8C" opacity=".7"/>
      </svg>
    </div>
    <div class="actions">
      <button class="btn btn-listen" type="button" id="listen">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M4 10h4l6-5v16l-6-5H4z" fill="#35285A"/><path d="M18 9c1.6 1.2 1.6 6.8 0 8M21 6c3.2 2.6 3.2 11.4 0 14" stroke="#35285A" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
        Listen
      </button>
      <button class="btn btn-trace" type="button">Trace it</button>
      <button class="btn btn-next" type="button">Next: আ</button>
      <p class="hint">Tap the letter to hear it again.</p>
    </div>
  </section>

  <aside class="side">
    <section class="progress clay" aria-labelledby="prog-title">
      <h2 id="prog-title">7 of 11 vowels learned</h2>
      <p>Two more today to fill the jar.</p>
      <div class="star-row" aria-label="3 of 5 stars today">
        <svg aria-hidden="true"><use href="#star" fill="url(#sg)"/></svg>
        <svg aria-hidden="true"><use href="#star" fill="url(#sg)"/></svg>
        <svg aria-hidden="true"><use href="#star" fill="url(#sg)"/></svg>
        <svg aria-hidden="true" style="filter:none"><use href="#star" fill="#F4C652"/></svg>
        <svg aria-hidden="true" style="filter:none"><use href="#star" fill="#F4C652"/></svg>
      </div>
      <div class="bar" role="progressbar" aria-valuenow="7" aria-valuemin="0" aria-valuemax="11" aria-label="Vowels learned"><i></i></div>
    </section>
    <section class="tiles clay" aria-labelledby="tiles-title">
      <h2 id="tiles-title">Shoroborno, the vowels</h2>
      <div class="grid" lang="bn">
        <button class="tile clay-sm now" aria-label="অ, current lesson"><span>অ</span></button>
        <button class="tile clay-sm done"><span>আ</span></button>
        <button class="tile clay-sm done"><span>ই</span></button>
        <button class="tile clay-sm done"><span>ঈ</span></button>
        <button class="tile clay-sm done"><span>উ</span></button>
        <button class="tile clay-sm done"><span>ঊ</span></button>
        <button class="tile clay-sm done"><span>ঋ</span></button>
        <button class="tile clay-sm done"><span>এ</span></button>
        <button class="tile locked" aria-label="ঐ, locked"><span>ঐ</span></button>
        <button class="tile locked" aria-label="ও, locked"><span>ও</span></button>
        <button class="tile locked" aria-label="ঔ, locked"><span>ঔ</span></button>
        <button class="tile locked" aria-label="Consonants, locked" style="font-size:22px"><span>ক খ</span></button>
      </div>
      <p class="unlock"><span class="lock clay-sm" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="9" width="14" height="9" rx="3" fill="#35285A"/><path d="M6 9V7a4 4 0 0 1 8 0v2" stroke="#35285A" stroke-width="2.4" fill="none"/></svg></span><span>Collect <b>2 more stars</b> to open ঐ</span></p>
    </section>
  </aside>
</main>
<a class="back" href="../#studies">Back to portfolio</a>
<script>
  // single interaction: squish the Listen button when the letter is tapped
  const l=document.querySelector('.letter'),b=document.getElementById('listen');
  l.addEventListener('click',()=>{b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),220)});
</script>
</body>
</html>
